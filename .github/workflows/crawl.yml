name: Monthly market data refresh

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl and export
        run: |
          python -m src.run fetch --full
          python -m src.run export

      - name: Commit data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/csv data/json data/manifest.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: monthly refresh $(date -u +%Y-%m)"
            git push
          fi
